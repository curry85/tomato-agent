<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>种植记事本 · 番茄智耘</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.5' fill='%23C8402E'/%3E%3Ccircle cx='12' cy='14' r='5.2' fill='none' stroke='%23fff' stroke-width='1.7'/%3E%3Cpath d='M12 8.8c-1.4-1.1-3.7-.5-4.6 1' fill='none' stroke='%23fff' stroke-width='1.7' stroke-linecap='round'/%3E%3Cpath d='M12 8.8c1.4-1.1 3.7-.5 4.6 1' fill='none' stroke='%23fff' stroke-width='1.7' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FAF8F4;
  --surface:#FFFFFF;
  --ink:#1F1B17;
  --muted:#6E655C;
  --faint:#A89E92;
  --line:#E8E2D6;
  --line-2:#F0EBE0;
  --accent:#C8402E;
  --accent-deep:#9E2F1D;
  --accent-tint:#F7E9E4;
  --sidebar-bg:#231D18;
  --sidebar-ink:#E8E0D4;
  --sidebar-muted:#8C8275;
  --paper:#FDFBF5;
  --paper-line:#E8DFC8;
  --radius:14px;
  --shadow-sm:0 1px 2px rgba(40,30,20,.05),0 6px 20px rgba(40,30,20,.06);
  --shadow:0 2px 6px rgba(40,30,20,.06),0 24px 60px -12px rgba(40,30,20,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.7;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  height:100vh;overflow:hidden;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--accent);color:#fff}

/* ============ 整体左右布局 ============ */
.app{display:flex;height:100vh}

/* ============ 左侧边栏（与 chat 一致） ============ */
.sidebar{
  width:260px;flex-shrink:0;background:var(--sidebar-bg);color:var(--sidebar-ink);
  display:flex;flex-direction:column;padding:20px 16px;
}
.side-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.side-brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff;flex-shrink:0}
.side-brand .logo svg{width:18px;height:18px}
.side-brand .tt b{display:block;font-size:16px;font-weight:600;color:#fff}
.side-brand .tt span{display:block;font-size:11.5px;color:var(--sidebar-muted);margin-top:2px}
.side-section-label{font-size:11.5px;letter-spacing:.1em;color:var(--sidebar-muted);padding:22px 10px 8px}
.side-nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.side-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
  color:var(--sidebar-ink);font-size:14px;transition:all .15s;cursor:pointer;border:none;background:transparent;text-align:left;width:100%;
}
.side-item svg{width:17px;height:17px;opacity:.75;flex-shrink:0}
.side-item:hover{background:rgba(255,255,255,.06);color:#fff}
.side-item.active{background:var(--accent);color:#fff}
.side-item.active svg{opacity:1}
.side-foot{padding-top:16px;border-top:1px solid rgba(255,255,255,.08)}
.side-status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sidebar-muted);padding:6px 10px 12px}
.side-status .dot{width:8px;height:8px;border-radius:50%;background:#6FB98F}
.side-back{
  display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;
  color:var(--sidebar-ink);font-size:13.5px;border:1px solid rgba(255,255,255,.12);transition:all .15s;
}
.side-back:hover{background:rgba(255,255,255,.06);color:#fff}
.side-back svg{width:15px;height:15px}

/* ============ 右侧主区域 ============ */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.topbar{
  height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;border-bottom:1px solid var(--line);background:rgba(250,248,244,.9);backdrop-filter:blur(10px);
}
.crumb{font-size:13.5px;color:var(--muted)}
.crumb b{color:var(--ink);font-weight:600}
.crumb .sep{margin:0 8px;color:var(--faint)}
.topbar-status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.topbar-status .dot{width:8px;height:8px;border-radius:50%;background:#6FB98F}

.notes-wrap{flex:1;overflow-y:auto;padding:24px 28px;max-width:1100px;width:100%;margin:0 auto}

/* 用户工具条 */
.userbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px;
}
.user-chip{
  display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  padding:7px 14px;border-radius:999px;font-size:13.5px;
}
.user-chip .avatar{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.btn{
  display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;
  padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  transition:all .15s;cursor:pointer;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-deep);color:#fff}
.btn svg{width:14px;height:14px}
.spacer{flex:1}

/* ============ 书本 ============ */
.book-stage{
  background:linear-gradient(180deg,#EDE4D0 0%,#E5DAC2 100%);
  border-radius:20px;padding:36px 30px;box-shadow:inset 0 2px 12px rgba(80,60,30,.08);
}
.book{
  position:relative;display:grid;grid-template-columns:1fr 1fr;
  background:var(--paper);border-radius:6px;
  box-shadow:0 20px 50px -12px rgba(60,40,20,.35), 0 2px 0 rgba(255,255,255,.6) inset;
  min-height:460px;
}
/* 书脊阴影 */
.book::before{
  content:"";position:absolute;left:50%;top:0;bottom:0;width:40px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent 0%,rgba(80,50,20,.14) 45%,rgba(80,50,20,.22) 50%,rgba(80,50,20,.14) 55%,transparent 100%);
  pointer-events:none;z-index:2;
}
.page{padding:36px 34px;position:relative}
.page-left{border-right:1px solid rgba(120,90,50,.12);display:flex;flex-direction:column}
.page-right{display:flex;flex-direction:column}

.page-label{font-size:11.5px;letter-spacing:.15em;color:var(--faint);text-transform:uppercase;margin-bottom:10px}
.page-date{
  font-size:24px;font-weight:700;letter-spacing:-.01em;color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.page-date .week{font-size:14px;color:var(--muted);font-weight:500;margin-left:10px}
.page-meta{margin-top:14px;font-size:13px;color:var(--muted);line-height:1.8}
.page-meta b{color:var(--ink);font-weight:600}

/* 左页导航 */
.page-nav{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:24px}
.nav-btn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:all .15s;
}
.nav-btn:hover:not(:disabled){color:var(--accent);border-color:var(--accent)}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.nav-btn svg{width:16px;height:16px}
.page-indicator{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* 右页：纸张横线 + textarea */
.paper-area{
  flex:1;position:relative;border-radius:4px;
  background-image:repeating-linear-gradient(transparent 0, transparent 31px, var(--paper-line) 31px, var(--paper-line) 32px);
  background-position:0 10px;
}
.paper-area textarea{
  width:100%;height:100%;min-height:340px;background:transparent;border:none;outline:none;resize:none;
  font-family:inherit;font-size:15px;line-height:32px;color:var(--ink);padding:10px 6px 0;
}
.paper-area textarea::placeholder{color:#C8BFA8}

.save-hint{margin-top:14px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;justify-content:flex-end}
.save-hint .dot{width:6px;height:6px;border-radius:50%;background:#6FB98F}

/* 空状态 */
.empty-book{
  grid-column:1 / -1;text-align:center;padding:80px 40px;color:var(--muted);
}
.empty-book h3{font-size:18px;color:var(--ink);margin-bottom:8px}
.empty-book p{font-size:14px;max-width:40ch;margin:0 auto 20px}

/* ============ 弹窗（用户名 / 切换用户） ============ */
.modal-mask{
  position:fixed;inset:0;background:rgba(30,20,15,.55);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:100;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-mask.show{opacity:1;pointer-events:auto}
.modal{
  background:var(--surface);border-radius:18px;padding:32px;width:min(420px,92vw);
  box-shadow:var(--shadow);transform:translateY(10px);transition:transform .2s;
}
.modal-mask.show .modal{transform:translateY(0)}
.modal h2{font-size:20px;font-weight:700;margin-bottom:6px}
.modal p{font-size:13.5px;color:var(--muted);margin-bottom:18px;line-height:1.7}
.modal input{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  font-size:15px;font-family:inherit;outline:none;transition:all .15s;
}
.modal input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.modal-actions{margin-top:18px;display:flex;gap:10px;justify-content:flex-end}
.modal-actions .btn{padding:10px 20px}

/* toast */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);z-index:99;
  background:#231D18;color:#fff;padding:11px 20px;border-radius:12px;font-size:14px;
  opacity:0;pointer-events:none;transition:all .3s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 响应式 */
@media (max-width:860px){
  .sidebar{width:64px;padding:16px 8px}
  .side-brand .tt,.side-section-label,.side-item span,.side-back span,.side-status span{display:none}
  .side-item{justify-content:center;padding:11px}
  .side-back{justify-content:center}
  .side-brand{justify-content:center;padding-bottom:14px}
  .notes-wrap{padding:16px 12px}
  .book{grid-template-columns:1fr;min-height:0}
  .page-left{border-right:none;border-bottom:1px solid rgba(120,90,50,.12)}
  .book::before{display:none}
  .paper-area textarea{min-height:200px}
}
</style>
</head>
<body>

<div class="app">

  <!-- ============ 左侧边栏 ============ -->
  <aside class="sidebar">
    <div class="side-brand">
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="14" r="6.5"/><path d="M12 7.5c-1.8-1.4-4.6-.7-5.7 1.2"/><path d="M12 7.5c1.8-1.4 4.6-.7 5.7 1.2"/></svg>

        <span>智能问答</span>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h11M9 5v4M3 9h12M15 5c2 0 4 1 5 3l-1 2-2-1-1 2-2-1-1 2-1-1z"/><circle cx="6" cy="17" r="1.4"/><circle cx="11" cy="17" r="1.4"/><circle cx="16" cy="17" r="1.4"/></svg>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M8 8h8M8 12h8M8 16h5"/><circle cx="19" cy="6" r="1.4"/><circle cx="19" cy="12" r="1.4"/><circle cx="19" cy="18" r="1.4"/></svg>

    <div class="side-foot">

      <a class="side-back" href="/">

  </aside>

  <!-- ============ 右侧主区域 ============ -->
  <main class="main">
    <div class="topbar">
      <div class="crumb">番茄智耘 <span class="sep">/</span> <b>种植记事本</b></div>
      <div class="topbar-status"><span class="dot"></span>本地已保存</div>

    <div class="notes-wrap">
      <div class="userbar">

          不知道记什么？让 AI 推荐

            <div class="page-nav">
              <button class="nav-btn" id="prevBtn" title="上一条" onclick="goto(current-1)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
              </button>
              <span class="page-indicator" id="indicator">—</span>
              <button class="nav-btn" id="nextBtn" title="下一条" onclick="goto(current+1)">

    <input id="userInput" type="text" maxlength="20" placeholder="例如：张师傅 / 李姐 / 老王" />
    <div class="modal-actions">
      <button class="btn" onclick="closeUserModal()" id="modalCancel" style="display:none">取消</button>
      <button class="btn btn-primary" onclick="saveUser()">开始使用</button>

<script>
/* ==================== 数据层（localStorage） ==================== */
const DB_KEY = 'tomato_notes_db';
const USER_KEY = 'tomato_notes_user';

function loadDB(){
  try{ return JSON.parse(localStorage.getItem(DB_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveDB(db){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
function currentUser(){ return localStorage.getItem(USER_KEY) || ''; }
function setUser(name){ localStorage.setItem(USER_KEY, name); }

function getUserNotes(name){
  const db = loadDB();
  if(!db[name]) db[name] = [];
  return db[name];
}
function persistUserNotes(name, list){
  const db = loadDB();
  db[name] = list;
  saveDB(db);
}

/* ==================== 状态 ==================== */
let notes = [];          // 当前用户的记录，按 updatedAt 倒序
let current = 0;         // 当前查看的下标（0 = 最新）
let saveTimer = null;

/* ==================== 初始化 ==================== */
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function weekdayStr(dateStr){
  const week = ['周日','周一','周二','周三','周四','周五','周六'];
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d)) return '';
  return week[d.getDay()];
}

function toastMsg(m){
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

function refreshUserBar(){
  const u = currentUser();
  document.getElementById('userName').textContent = u || '未登录';
  document.getElementById('userAvatar').textContent = u ? u[0] : '?';
}

function loadUserNotes(){
  const u = currentUser();
  notes = u ? getUserNotes(u) : [];
  // 按 updatedAt 倒序：最新的在 index 0
  notes.sort((a,b)=> (b.updatedAt||0) - (a.updatedAt||0));
  current = 0;
  renderPage();
}

function renderPage(){
  const dateEl = document.getElementById('pageDate');
  const metaEl = document.getElementById('pageMeta');
  const indicator = document.getElementById('indicator');
  const contentEl = document.getElementById('content');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  if(!notes.length){
    dateEl.innerHTML = '还没有记录';
    metaEl.innerHTML = '点右上角「<b>记今天</b>」开始写第一段农事，或让 AI 推荐今天值得记什么。';
    indicator.textContent = '0 / 0';
    contentEl.value = '';
    contentEl.disabled = true;
    prevBtn.disabled = nextBtn.disabled = true;
    return;
  }

  contentEl.disabled = false;
  const n = notes[current];
  dateEl.innerHTML = n.date + '<span class="week">' + weekdayStr(n.date) + '</span>';
  const totalWords = (n.content || '').length;
  metaEl.innerHTML =
    '这是 <b>' + (currentUser()||'我') + '</b> 的第 <b>' + (notes.length - current) + '</b> 段农事记录，' +
    '共 <b>' + totalWords + '</b> 字。';
  indicator.textContent = (current + 1) + ' / ' + notes.length;
  contentEl.value = n.content || '';
  prevBtn.disabled = (current === 0);
  nextBtn.disabled = (current === notes.length - 1);
}

function goto(i){
  if(i < 0 || i >= notes.length) return;
  current = i;
  renderPage();
}

/* ==================== 新建今天 ==================== */
function createToday(){
  if(!currentUser()){ openUserModal(true); return; }
  const u = currentUser();
  const today = todayStr();
  // 今天已存在 → 跳到那条
  const existing = notes.findIndex(n => n.date === today);
  if(existing >= 0){
    current = existing;
    renderPage();
    document.getElementById('content').focus();
    toastMsg('今天已经有一段记录，接着写');
    return;
  }
  const note = { date: today, content: '', updatedAt: Date.now() };
  notes.unshift(note);
  persistUserNotes(u, notes);
  current = 0;
  renderPage();
  document.getElementById('content').focus();
  toastMsg('新的一页，写今天吧');
}

/* ==================== 自动保存（防抖 600ms） ==================== */
document.getElementById('content').addEventListener('input', ()=>{
  if(!notes.length) return;
  const hint = document.getElementById('saveHint');
  hint.textContent = '编辑中…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    if(!currentUser()) return;
    notes[current].content = document.getElementById('content').value;
    notes[current].updatedAt = Date.now();
    persistUserNotes(currentUser(), notes);
    hint.textContent = '已自动保存';
  }, 600);
});

/* ==================== 切换用户弹窗 ==================== */
let modalCallback = null;
function openUserModal(isFirst){
  const u = currentUser();
  if(u && !isFirst){
    document.getElementById('modalTitle').textContent = '切换用户';
    document.getElementById('modalDesc').textContent = '输入一个新的名字进入该师傅的记事本。不同名字的记录互不干扰。';
  } else {
    document.getElementById('modalTitle').textContent = '欢迎来到番茄智耘农事记事本';
    document.getElementById('modalDesc').textContent = '记事本按用户名分开保存，不同师傅的记录互不干扰。先告诉我怎么称呼你。';
  }
  document.getElementById('userInput').value = u || '';
  document.getElementById('modalCancel').style.display = u ? '' : 'none';
  document.getElementById('userModal').classList.add('show');
  setTimeout(()=>document.getElementById('userInput').focus(), 100);
}
function closeUserModal(){
  document.getElementById('userModal').classList.remove('show');
}
function saveUser(){
  const name = document.getElementById('userInput').value.trim();
  if(!name){ toastMsg('名字不能为空'); return; }
  setUser(name);
  closeUserModal();
  refreshUserBar();
  loadUserNotes();
  toastMsg('你好，' + name);
}

/* ==================== AI 推荐 ==================== */
function askAISuggest(){
  const q = '今天我在江汉平原大棚番茄里最值得记录的农事要点是什么？请给我一个简短的记录清单，比如浇水、打杈、花果、病害观察这几类，让我照着往记事本里填。';
  location.href = 'chat.html?ask=' + encodeURIComponent(q);
}

/* ==================== 启动 ==================== */
if(!currentUser()){
  // 首次进入：强制要用户名
  openUserModal(true);
}
refreshUserBar();
loadUserNotes();

/* 键盘左右翻页 */
document.addEventListener('keydown', (e)=>{
  if(e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if(e.key === 'ArrowLeft') goto(current - 1);
  if(e.key === 'ArrowRight') goto(current + 1);
});
</script>
